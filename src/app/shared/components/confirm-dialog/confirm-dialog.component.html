@if (isOpen()) {
  <div class="modal-backdrop" (click)="onCancel()">
    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'dialog-title'"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h3 id="dialog-title" class="modal-title">{{ title() }}</h3>
        <button
          type="button"
          class="btn-close"
          aria-label="Close dialog"
          (click)="onCancel()"
        >
          &times;
        </button>
      </div>

      <div class="modal-body">
        <p>{{ message() }}</p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          [class]="'btn ' + (isDestructive() ? 'btn-danger' : 'btn-primary')"
          (click)="onConfirm()"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
