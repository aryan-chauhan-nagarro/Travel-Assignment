<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Travel Booking — Awaken to a Different World</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Discover destinations, browse premium stays, and book seamlessly with our modern travel platform." />
    <meta name="theme-color" content="#26D9B0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Performance: Preconnect & DNS-Prefetch to Font & Image CDNs -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- LCP Image Preload for Instant First Paint -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=640&auto=format&fit=crop&q=65"
      fetchpriority="high"
    />
    <!-- Font Preload & Non-blocking stylesheet -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Inter:wght@400;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
